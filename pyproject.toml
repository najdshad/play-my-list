[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "play-my-list"
version = "0.1.0"
description = "Telegram playlist builder and publisher"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.13,<4", "aiohttp>=3.10,<4", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "build>=1,<2"]

[project.scripts]
play-my-list = "bot.main:main"

[tool.setuptools.packages.find]
include = ["bot*", "miniapp*"]

[tool.setuptools.package-data]
"bot.db" = ["schema.sql"]
miniapp = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
